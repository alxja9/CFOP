<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFOP avanzado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#14181d;--mu:#5d6773;--bd:#d6dce3;--ac:#1c5fd6;--ok:#14a05a;--wip:#e8890c;--bad:#d23b3b;--tm:#14181d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#171d24;--tx:#e8edf2;--mu:#8d99a6;--bd:#27303a;--ac:#5b97ff;--ok:#2fc57a;--wip:#f2a03a;--bad:#ef6a6a;--tm:#f4f7fa}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#171d24;--tx:#e8edf2;--mu:#8d99a6;--bd:#27303a;--ac:#5b97ff;--ok:#2fc57a;--wip:#f2a03a;--bad:#ef6a6a;--tm:#f4f7fa}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Space Grotesk",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:4px 0 12px;font-weight:700}
.tabs{display:flex;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:500;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:12px 0;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left}
.sh b{flex:1;font-weight:700}.sh small{color:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;width:90px;display:flex}
.bar i{display:block;height:100%}.g{background:var(--ok)}.o{background:var(--wip)}
.rows{border-top:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.st{width:30px;height:30px;border-radius:7px;border:2px solid var(--bd);background:none;color:#fff;font-weight:700;cursor:pointer;flex:none}
.st[data-v="1"]{background:var(--wip);border-color:var(--wip)}.st[data-v="2"]{background:var(--ok);border-color:var(--ok)}
.nm{width:104px;flex:none;font-weight:500}.row.tc .nm{flex:1;width:auto}
.row input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;padding:6px 8px;font:inherit;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tools input{flex:1;min-width:140px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.leg{color:var(--mu);font-size:14px;margin:4px 0 0}
#tz{margin:14px 0;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:30px 10px;text-align:center;user-select:none;touch-action:none;cursor:pointer;border-width:3px}
#tz.hold{border-color:var(--bad)}#tz.ready{border-color:var(--ok)}#tz.run{border-color:var(--ac)}
#tm{font-size:clamp(56px,18vw,104px);font-weight:700;color:var(--tm);font-variant-numeric:tabular-nums;line-height:1}
#tz.hold #tm{color:var(--bad)}#tz.ready #tm{color:var(--ok)}
#hint{color:var(--mu);margin-top:10px;font-size:14px}
#sc{font-size:18px;text-align:center;letter-spacing:.02em;margin:6px 0}
.ctl{display:flex;gap:8px;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.grid b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.grid span{color:var(--mu);font-size:13px}
.sv{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.sv .t{font-weight:700;font-size:18px;width:96px}.sv .d{flex:1;color:var(--mu);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv button{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:6px;padding:4px 8px;font:inherit;font-size:13px;cursor:pointer}
.sv button.on{background:var(--wip);border-color:var(--wip);color:#fff}
.em{color:var(--mu);text-align:center;padding:24px 10px}
.hid{display:none}
</style></head><body><main>
<h1>CFOP avanzado</h1>
<div class="tabs" id="tabs"><button data-t="e" class="on">Estudio</button><button data-t="t">Timer</button><button data-t="r">Registro</button></div>
<section id="e"></section>
<section id="t" class="hid">
 <div id="sc"></div>
 <div id="tz"><div id="tm">0.00</div><div id="hint">Mantén espacio (o toca y mantén) hasta ver verde; suelta para iniciar</div></div>
 <div class="ctl"><button class="chip" id="nsc">Nueva mezcla</button><button class="chip" id="lastdel">Borrar último</button></div>
 <div class="grid" id="mini"></div>
</section>
<section id="r" class="hid"></section>
</main>
<script>
const $=s=>document.querySelector(s);
let S={st:{},n:{},open:{},solves:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("cfop1")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cfop1",JSON.stringify(S))}catch(e){}};
const rg=(n,p)=>Array.from({length:n},(_,i)=>p+" "+(i+1));
const SETS=[
{id:"tec",t:"Técnicas y hábitos",tc:1,items:["Cross en 8 movimientos o menos","Cross en la cara de abajo","Cross de color neutral","Inspección: planear cross y primer par","Look-ahead durante F2L","Elegir el par más fácil de resolver","Pares en slot sin romper otros","Multislotting","Resolver sin rotaciones de cubo","Trabajar con edges libres (pseudo-slots)","X-cross y XX-cross","Finger tricks fluidos","Pausas mínimas entre OLL y PLL","Pre-AUF y AUF eficientes","Reconocer OLL de un vistazo","Reconocer PLL de un vistazo","Anticipar skips de PLL","Elegir algoritmo según agarre"]},
{id:"f2l",t:"F2L (41 casos)",items:rg(41,"F2L")},
{id:"oll",t:"OLL (57 casos)",items:rg(57,"OLL")},
{id:"pll",t:"PLL (21 casos)",items:["Aa","Ab","E","F","Ga","Gb","Gc","Gd","H","Ja","Jb","Na","Nb","Ra","Rb","T","Ua","Ub","V","Y","Z"]},
{id:"ext",t:"Extras: VLS, ZBLS, COLL, OLLCP",tc:1,items:["VLS (par + orientación de últimas)","ZBLS","Winter variation","COLL (40 casos)","OLLCP","ZBLL (conjuntos más usados)","Edge control en último par"]}];
const cnt=s=>{let a=0,b=0;s.items.forEach(x=>{const v=S.st[s.id+":"+x]||0;if(v==2)a++;else if(v==1)b++});return[a,b]};
let flt="all",q="";
function renderE(){
 let tot=0,done=0;SETS.forEach(s=>{tot+=s.items.length;done+=cnt(s)[0]});
 let h=`<div class="tools"><input id="q" placeholder="Buscar caso…" value="${q}"><button class="chip ${flt=="all"?"on":""}" data-f="all">Todos</button><button class="chip ${flt=="pend"?"on":""}" data-f="pend">Pendientes</button></div>
 <p class="leg">Aprendidos: <b>${done}</b> de ${tot} (${Math.round(done/tot*100)}%). Toca el cuadro: vacío → aprendiendo → aprendido.</p>`;
 SETS.forEach(s=>{const[a,b]=cnt(s),n=s.items.length,op=S.open[s.id]||q;
  h+=`<div class="sec"><button class="sh" data-o="${s.id}"><b>${s.t}</b><small>${a}/${n}</small><span class="bar"><i class="g" style="width:${a/n*100}%"></i><i class="o" style="width:${b/n*100}%"></i></span></button>`;
  if(op){h+=`<div class="rows">`;s.items.forEach(x=>{const id=s.id+":"+x,v=S.st[id]||0;
   if(flt=="pend"&&v==2)return;if(q&&!x.toLowerCase().includes(q.toLowerCase()))return;
   h+=`<div class="row ${s.tc?"tc":""}"><button class="st" data-v="${v}" data-id="${id}" aria-label="Estado de ${x}">${v==2?"✓":v==1?"…":""}</button><span class="nm">${x}</span>${s.tc?"":`<input data-n="${id}" placeholder="Mi algoritmo / nota" value="${(S.n[id]||"").replace(/"/g,"&quot;")}">`}</div>`});
   h+=`</div>`}
  h+=`</div>`});
 $("#e").innerHTML=h;
}
$("#e").addEventListener("click",e=>{
 const st=e.target.closest(".st"),o=e.target.closest("[data-o]"),f=e.target.closest("[data-f]");
 if(st){const id=st.dataset.id;S.st[id]=((S.st[id]||0)+1)%3;save();const y=scrollY;renderE();scrollTo(0,y)}
 else if(o){S.open[o.dataset.o]=!S.open[o.dataset.o];save();renderE()}
 else if(f){flt=f.dataset.f;renderE()}
});
$("#e").addEventListener("input",e=>{
 if(e.target.dataset.n){S.n[e.target.dataset.n]=e.target.value;save()}
 else if(e.target.id=="q"){q=e.target.value;const p=e.target.selectionStart;renderE();const i=$("#q");i.focus();i.setSelectionRange(p,p)}
});
/* tiempos */
const fmt=ms=>{if(ms==Infinity)return"DNF";const s=ms/1000;if(s>=60){const m=Math.floor(s/60);return m+":"+(s-m*60).toFixed(2).padStart(5,"0")}return s.toFixed(2)};
const val=x=>x.p==-1?Infinity:x.t+(x.p==2?2000:0);
function ao(n,list){if(list.length<n)return null;const v=list.slice(0,n).map(val).sort((a,b)=>a-b);if(v.filter(x=>x==Infinity).length>1)return Infinity;const m=v.slice(1,-1);return m.reduce((a,b)=>a+b,0)/m.length}
function scr(){const F="UDFBLR",M=["","'","2"];let o=[],l="";for(let i=0;i<20;i++){let f;do{f=F[Math.random()*6|0]}while(f==l||(l&&Math.floor(F.indexOf(f)/2)==Math.floor(F.indexOf(l)/2)&&i>0&&o.length>1&&o[o.length-2][0]==f));o.push(f+M[Math.random()*3|0]);l=f}return o.join(" ")}
let cur=scr();$("#sc").textContent=cur;
$("#nsc").onclick=()=>{cur=scr();$("#sc").textContent=cur};
function stats(){const L=S.solves,v=L.map(val).filter(x=>x<Infinity);
 let best=v.length?Math.min(...v):null,mean=v.length?v.reduce((a,b)=>a+b,0)/v.length:null,b5=null;
 for(let i=0;i+5<=L.length;i++){const a=ao(5,L.slice(i));if(a!==null&&a<Infinity&&(b5===null||a<b5))b5=a}
 return[["Mejor",best],["Media",mean],["Mejor ao5",b5],["ao5",ao(5,L)],["ao12",ao(12,L)],["Resueltos",L.length]]}
const cell=(k,v)=>`<div><b>${k=="Resueltos"?v:(v===null?"–":fmt(v))}</b><span>${k}</span></div>`;
function renderMini(){$("#mini").innerHTML=stats().map(([k,v])=>cell(k,v)).join("")}
function renderR(){
 let h=`<div class="grid">${stats().map(([k,v])=>cell(k,v)).join("")}</div>`;
 if(!S.solves.length)h+=`<div class="em">Aún no hay tiempos. Resuelve con el timer y aparecerán aquí.</div>`;
 else{h+=`<div class="sec">`;S.solves.forEach((x,i)=>{h+=`<div class="sv"><span class="t">${fmt(val(x))}${x.p==2?"+":""}</span><span class="d" title="${x.s}">${new Date(x.d).toLocaleDateString("es-MX",{day:"numeric",month:"short"})} · ${x.s}</span><button data-a="2" data-i="${i}" class="${x.p==2?"on":""}">+2</button><button data-a="-1" data-i="${i}" class="${x.p==-1?"on":""}">DNF</button><button data-a="x" data-i="${i}" aria-label="Borrar">✕</button></div>`});h+=`</div><div class="ctl"><button class="chip" id="clr">Borrar todos</button></div>`}
 $("#r").innerHTML=h}
$("#r").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id=="clr"){if(confirm("¿Borrar todos los tiempos?")){S.solves=[];save();renderR()}return}
 const i=+b.dataset.i,a=b.dataset.a;if(a=="x")S.solves.splice(i,1);else S.solves[i].p=S.solves[i].p==+a?0:+a;save();renderR()});
$("#lastdel").onclick=()=>{S.solves.shift();save();renderMini()};
/* timer */
const T={s:"idle",t0:0,h:0,raf:0},tz=$("#tz"),tm=$("#tm");
function ui(){tz.className=T.s=="hold"?"hold":T.s=="ready"?"ready":T.s=="run"?"run":""}
function tick(){tm.textContent=fmt(performance.now()-T.t0).replace(/(\d)$/,"$1");T.raf=requestAnimationFrame(tick)}
function press(){
 if(T.s=="run"){cancelAnimationFrame(T.raf);const t=performance.now()-T.t0;tm.textContent=fmt(t);S.solves.unshift({t:Math.round(t/10)*10,p:0,s:cur,d:Date.now()});save();cur=scr();$("#sc").textContent=cur;T.s="stopped";ui();renderMini();return}
 if(T.s=="idle"){T.s="hold";ui();T.h=setTimeout(()=>{if(T.s=="hold"){T.s="ready";ui()}},300)}}
function release(){
 if(T.s=="ready"){T.s="run";T.t0=performance.now();ui();tick()}
 else if(T.s=="hold"){clearTimeout(T.h);T.s="idle";ui()}
 else if(T.s=="stopped"){T.s="idle";ui()}}
tz.addEventListener("pointerdown",e=>{e.preventDefault();press()});
tz.addEventListener("pointerup",release);
tz.addEventListener("pointercancel",release);
addEventListener("keydown",e=>{if(e.code=="Space"&&!$("#t").classList.contains("hid")){e.preventDefault();if(!e.repeat)press()}});
addEventListener("keyup",e=>{if(e.code=="Space"&&!$("#t").classList.contains("hid")){e.preventDefault();release()}});
/* tabs */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x==b));
 ["e","t","r"].forEach(k=>$("#"+k).classList.toggle("hid",k!=b.dataset.t));
 if(b.dataset.t=="r")renderR();if(b.dataset.t=="t")renderMini();if(b.dataset.t=="e")renderE()});
renderE();renderMini();
</script></body></html>
